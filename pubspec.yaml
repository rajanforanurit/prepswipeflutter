name: prepswipe
description: PrepSwipe - Competitive Exam Preparation App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  http: ^1.2.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  uuid: ^4.4.2
  flutter_card_swiper: ^7.0.2
  share_plus: ^10.0.0
  timeago: ^3.7.1
  url_launcher: ^6.3.1
  audioplayers: ^6.0.0
  razorpay_flutter: ^1.4.5
  lottie: ^3.3.3
  path_provider: ^2.1.5
  google_mobile_ads: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/image/prepswipehomescreen.png
    - assets/image/googlelogo.png
    - assets/music/correct_answer.mp3
    - assets/music/wrong_answer.mp3
    - assets/animatedicons/Streak Fire.json
    - assets/animatedicons/Fireanimation.json
    - assets/image/appicon_v1.2.png
    - assets/image/appicon_foreground_v1.2.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/appicon_v1.2.png"

  adaptive_icon_background: "#011136"
  adaptive_icon_foreground: "assets/image/appicon_foreground_v1.2.png"

  min_sdk_android: 21
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/image/appicon_v1.2.png"

  windows:
    generate: true
    image_path: "assets/image/appicon_v1.2.png"
  macos:
    generate: true
    image_path: "assets/image/appicon_v1.2.png"


flutter_native_splash:
  color: "#011136"
  image: assets/image/appicon_v1.2.png
  color_dark: "#011136"
  image_dark: assets/image/appicon_v1.2.png
  android: true
  ios: true
  android_12:
    image: assets/image/appicon_foreground_v1.2.png
    icon_background_color: "#011136"
    image_dark: assets/image/appicon_foreground_v1.2.png
    icon_background_color_dark: "#011136"
  fullscreen: true
  android_gravity: center       